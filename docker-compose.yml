services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: museum_sql_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Museum@Admin2026!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: