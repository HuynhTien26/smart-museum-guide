name: Museum CI/CD Pipeline

# 1. KÍCH HOẠT QUY TRÌNH
# Tự động chạy khi có code mới đẩy (push) lên nhánh 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: XỬ LÝ API BACKEND
  # ==========================================
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        working-directory: ./apps/api-backend
        run: npm install

  # ==========================================
  # JOB 2: XỬ LÝ MOBILE APP (REACT/VITE)
  # ==========================================
  build-mobile-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./apps/mobile-app
        run: npm install

      - name: Build Mobile App
        working-directory: ./apps/mobile-app
        # Tiêm tên miền API thật vào để thay thế cho localhost lúc build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }} 
        run: npm run build
