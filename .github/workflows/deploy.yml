name: Museum CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: KIỂM TRA & BUILD API BACKEND
  # ==========================================
  ci-server-api:
    name: Typecheck & Build Backend
    runs-on: pnpm --filter ./apps/server-api... run build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck & Build Backend

        run: pnpm --filter ./apps/server-api... run build --if-present

  # ==========================================
  # JOB 2: BUILD MOBILE APP (REACT/VITE)
  # ==========================================
  ci-mobile-app:
    name: Build Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Mobile App
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'http://localhost:3000' }}

        run: pnpm --filter ./apps/mobile-app... run build

  # ==========================================
  # JOB 3: BUILD WEB DASHBOARD (REACT/VITE)
  # ==========================================
  ci-web-dashboard:
    name: Build Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Dashboard
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'http://localhost:3000' }}

        run: pnpm --filter ./apps/web-dashboard... run build
